<title>LaLiga Match Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: match-sheet tool. Sticky top bar, one column on phones, two columns (inputs | results) from 900px; bottom tab bar on phones. */
:root {
  --paper: #f3f5f2;
  --sheet: #ffffff;
  --ink: #15201b;
  --ink-2: #4c5a53;
  --ink-3: #5c6a63;
  --rule: #d9dfdb;
  --rule-2: #e8ece9;
  --home: #2346c8;
  --home-soft: #e3e9fb;
  --away: #b8432a;
  --away-soft: #f8e5df;
  --draw: #67716c;
  --ok: #1f7a4d;
  --ok-soft: #dff1e6;
  --warn: #9a6a00;
  --warn-soft: #fbf0d3;
  --bad: #b3261e;
  --bad-soft: #fbe2df;
  --focus: #2346c8;
  --on-accent: #ffffff;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1513; --sheet: #161e1b; --ink: #e6ece8; --ink-2: #a9b6b0; --ink-3: #7b8983;
    --rule: #2a3531; --rule-2: #212b27; --home: #7d98ff; --home-soft: #1d2747; --away: #f08a6c; --away-soft: #3d2019;
    --draw: #5a6560; --ok: #5cc98f; --ok-soft: #15301f; --warn: #e6b955; --warn-soft: #352a0f; --bad: #ff8a80; --bad-soft: #3a1714;
    --focus: #7d98ff; --on-accent: #0f1513; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1513; --sheet: #161e1b; --ink: #e6ece8; --ink-2: #a9b6b0; --ink-3: #7b8983;
  --rule: #2a3531; --rule-2: #212b27; --home: #7d98ff; --home-soft: #1d2747; --away: #f08a6c; --away-soft: #3d2019;
  --draw: #5a6560; --ok: #5cc98f; --ok-soft: #15301f; --warn: #e6b955; --warn-soft: #352a0f; --bad: #ff8a80; --bad-soft: #3a1714;
  --focus: #7d98ff; --on-accent: #0f1513; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.topbar-in { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font: 700 22px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: baseline; gap: 10px; }
.brand small { font: 500 12px/1 var(--f-data); color: var(--ink-3); text-transform: none; letter-spacing: 0; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs a { font: 600 15px/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); text-decoration: none; padding: 8px 12px; border-radius: var(--r); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.tabs a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, .rowbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
main { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 110px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: 34px; font-weight: 700; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
h2 { font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
h3 { font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
p { margin: 0; max-width: 68ch; }
.lede { color: var(--ink-2); }
.stack { display: grid; gap: 16px; }
.stack-s { display: grid; gap: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid2 { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); align-items: start; } .grid2 > .sticky { position: sticky; top: 76px; } }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; min-width: 0; }
.label { font: 500 11px/1.2 var(--f-data); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.field { display: grid; gap: 5px; }
select, input[type="date"] { font: 500 15px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 9px 10px; width: 100%; min-height: 42px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink-2); }
.check input { margin-top: 3px; }
button.btn { font: 600 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 11px 14px; border-radius: var(--r); cursor: pointer; }
button.ghost { background: transparent; color: var(--ink); }
.fieldpair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
.swap { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); border-radius: var(--r); height: 42px; width: 42px; cursor: pointer; font: 600 16px var(--f-data); }
.num, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 500 11px/1 var(--f-data); text-transform: uppercase; letter-spacing: .05em; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.home { background: var(--home-soft); color: var(--home); border-color: transparent; }
.chip.away { background: var(--away-soft); color: var(--away); border-color: transparent; }
.notice { border-left: 3px solid var(--warn); background: var(--warn-soft); color: var(--ink); padding: 10px 12px; border-radius: 0 var(--r) var(--r) 0; font-size: 14px; }
.notice.bad { border-color: var(--bad); background: var(--bad-soft); }
.notice.info { border-color: var(--home); background: var(--home-soft); }
.notice b { font-weight: 600; }
/* scoreboard */
.board { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 12px; align-items: center; }
.board .team { font: 700 26px/1.05 var(--f-display); text-transform: uppercase; overflow-wrap: anywhere; }
.board .team.h { color: var(--home); }
.board .team.a { color: var(--away); text-align: right; }
.board .xg { font: 500 34px/1 var(--f-data); font-variant-numeric: tabular-nums; display: flex; gap: 10px; align-items: baseline; }
.board .xg span.sep { color: var(--ink-3); font-size: 22px; }
.sub { font-size: 13px; color: var(--ink-3); }
.bar { display: flex; height: 34px; border-radius: var(--r); overflow: hidden; font: 600 13px var(--f-data); }
.bar > div { display: flex; align-items: center; justify-content: center; min-width: 0; color: var(--on-accent); white-space: nowrap; overflow: hidden; }
.bar .H { background: var(--home); } .bar .D { background: var(--draw); } .bar .A { background: var(--away); }
.barlegend { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 13px; color: var(--ink-2); }
.barlegend div:nth-child(2) { text-align: center; } .barlegend div:nth-child(3) { text-align: right; }
.scores { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.score { border: 1px solid var(--rule); border-radius: var(--r); padding: 6px 8px; display: grid; gap: 2px; }
.score b { font: 600 18px var(--f-data); }
.score span { font: 400 12px var(--f-data); color: var(--ink-3); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 16px; }
.kv > div { display: grid; gap: 2px; }
.kv b { font: 500 18px var(--f-data); font-variant-numeric: tabular-nums; }
/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { font: 500 11px/1.2 var(--f-data); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; background: var(--sheet); position: sticky; top: 0; }
td { padding: 8px 10px; border-bottom: 1px solid var(--rule-2); vertical-align: top; }
td.n, th.n { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td .home { color: var(--home); font-weight: 600; } td .away { color: var(--away); font-weight: 600; }
.rowbtn { all: unset; cursor: pointer; font-weight: 600; color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.rowbtn:hover { text-decoration-color: var(--ink); }
tr.sel td { background: var(--home-soft); }
/* evidence bars */
.ev { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--rule-2); }
.ev .cur { background: var(--ink); } .ev .prev { background: var(--ink-3); } .ev .pri { background: repeating-linear-gradient(45deg, var(--warn) 0 3px, transparent 3px 6px); }
.evlegend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }
.evlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.form5 { display: inline-flex; gap: 3px; }
.form5 i { font: 600 11px/18px var(--f-data); width: 18px; text-align: center; border-radius: 3px; font-style: normal; color: var(--on-accent); }
.form5 .W { background: var(--ok); } .form5 .D { background: var(--draw); } .form5 .L { background: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 7px 11px; font: 500 13px var(--f-body); color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.timeline { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(64px, 1fr); gap: 4px; overflow-x: auto; }
.timeline div { border: 1px solid var(--rule); border-radius: var(--r); padding: 6px; font-size: 12px; display: grid; gap: 2px; }
.timeline div.off { opacity: .45; border-style: dashed; }
.timeline b { font: 600 13px var(--f-data); }
details summary { cursor: pointer; font: 600 15px var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.foot { font-size: 12px; color: var(--ink-3); }
.matrix td.y { color: var(--ok); text-align: center; } .matrix td.no { color: var(--ink-3); text-align: center; }
input[type="search"] { font: 15px var(--f-body); padding: 9px 10px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--paper); color: var(--ink); width: 100%; max-width: 360px; }
@media (max-width: 720px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; background: var(--sheet); border-top: 1px solid var(--rule); justify-content: space-around; z-index: 6;
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabs a { font-size: 13px; padding: 9px 8px; flex: 1; text-align: center; }
  h1 { font-size: 28px; }
  .board .team { font-size: 21px; }
  .board .xg { font-size: 28px; }
}
@media (prefers-reduced-motion: no-preference) { .bar > div { transition: flex-basis .35s ease; } }
</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">Match Lab <small id="asof"></small></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#predict" data-tab="predict">Predict</a>
      <a href="#seasons" data-tab="seasons">Seasons &amp; Teams</a>
      <a href="#data" data-tab="data">Dataset</a>
      <a href="#validation" data-tab="validation">Validation</a>
    </nav>
  </div>
</header>
<main id="app"><p class="lede">Loading match data…</p></main>

<script src="data.js"></script>
<script src="app.js"></script>
